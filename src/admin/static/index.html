<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Proxy</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>LLM Proxy</h1>
        <div class="header-actions">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="proxies" data-i18n="tabProxies">监听转发</button>
            <button class="tab" data-tab="logs" data-i18n="tabLogs">历史日志</button>
          </div>
          <select id="languageSelect" class="language-toggle" data-i18n-title="language">
            <option value="zh">🇨🇳 中文</option>
            <option value="en">🇺🇸 English</option>
          </select>
        </div>
      </header>
      <main>
        <section id="proxies" class="view proxy-view active">
          <div class="toolbar">
            <strong data-i18n="proxyPairs">地址对</strong>
            <div>
              <button id="addProxy" data-i18n-title="add" title="添加">+</button>
              <button id="saveProxies" class="primary" data-i18n="saveConfig">保存配置</button>
            </div>
          </div>
          <div id="proxyGrid" class="proxy-grid"></div>
        </section>
        <section id="logs" class="view logs-view">
          <aside class="log-list">
            <div class="log-list-head">
              <div class="log-search">
                <input
                  id="logSearch"
                  data-i18n-placeholder="filterPlaceholder"
                  placeholder="搜索时间 / 请求 / 响应 / id"
                />
                <button id="searchLogs" class="primary" data-i18n="search">搜索</button>
              </div>
              <div class="log-search-progress" id="logSearchProgress" hidden><div></div></div>
              <div class="log-actions">
                <button id="selectAllLogs" data-i18n="selectAllLogs">全选</button>
                <button id="cleanupLogs" data-i18n="cleanupSelectedLogs">清理选中</button>
                <button id="exportLogs" data-i18n="exportLogs">导出</button>
                <button id="refreshLogs" data-i18n="refresh">刷新</button>
                <label class="auto-refresh" data-i18n-title="autoRefresh">
                  <input id="autoRefreshLogs" type="checkbox" checked />
                  <span data-i18n="autoRefresh">自动刷新</span></label
                >
              </div>
            </div>
            <div id="logItems" class="log-items"></div>
          </aside>
          <div id="logSplitter" class="log-splitter"></div>
          <section id="detail" class="detail">
            <div class="json-pane">
              <div class="pane-head">
                <strong data-i18n="request">Request</strong
                ><span class="pane-actions"
                  ><button class="icon" data-meta="request" title="显示元信息">ⓘ</button
                  ><button
                    class="icon"
                    data-wrap="request"
                    data-i18n-title="toggleWrap"
                    title="切换自动换行"
                  >
                    ↵</button
                  ><button class="icon" data-expand="request" title="向下展开一级">{}</button
                  ><button
                    class="icon"
                    data-format="request"
                    data-i18n-title="formatStringContent"
                    title="格式化字符串内容"
                  >
                    📝</button
                  ><button
                    class="icon"
                    data-copy="request"
                    data-i18n-title="copyJson"
                    title="复制 JSON"
                  >
                    📋
                  </button></span
                >
              </div>
              <div id="requestMeta" class="meta-panel json-view wrap" hidden></div>
              <div id="requestJson" class="json-view nowrap"></div>
            </div>
            <div id="splitter" class="splitter"></div>
            <div class="json-pane">
              <div class="pane-head">
                <span class="pane-title"
                  ><strong data-i18n="response">Response</strong
                  ><span id="responseTiming" class="response-timing" hidden></span></span
                ><span class="pane-actions"
                  ><button class="icon" data-meta="response" title="显示元信息">ⓘ</button
                  ><button
                    class="icon"
                    data-wrap="response"
                    data-i18n-title="toggleWrap"
                    title="切换自动换行"
                  >
                    ↵</button
                  ><button class="icon" data-expand="response" title="向下展开一级">{}</button
                  ><button
                    class="icon"
                    data-format="response"
                    data-i18n-title="formatStringContent"
                    title="格式化字符串内容"
                  >
                    📝</button
                  ><button
                    class="icon"
                    data-copy="response"
                    data-i18n-title="copyJson"
                    title="复制 JSON"
                  >
                    📋
                  </button></span
                >
              </div>
              <div id="responseMeta" class="meta-panel json-view wrap" hidden></div>
              <div id="responseJson" class="json-view nowrap"></div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <dialog id="targetCheckDialog" class="target-check-dialog">
      <form id="targetCheckForm" class="target-check-form">
        <h2 data-i18n="checkDialogTitle">测试转发地址</h2>
        <label>
          <span data-i18n="targetUrl">转发地址</span>
          <input id="targetCheckUrl" readonly />
        </label>
        <label>
          <span data-i18n="checkApiType">API 类型</span>
          <select id="targetCheckApiType">
            <option value="chat">OpenAI Chat Completions</option>
            <option value="responses">OpenAI Responses</option>
            <option value="anthropic">Anthropic Messages</option>
          </select>
        </label>
        <label>
          <span data-i18n="targetApiKey">API Key</span>
          <input id="targetCheckApiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label>
          <span data-i18n="checkModel">模型 ID</span>
          <input
            id="targetCheckModel"
            list="targetCheckModelOptions"
            placeholder="gpt-4o-mini"
            autocomplete="off"
            required
          />
          <datalist id="targetCheckModelOptions">
            <option value="gpt-4o-mini"></option>
            <option value="gpt-5.6-sol"></option>
            <option value="gpt-5.6-luna"></option>
            <option value="claude-haiku-4-5"></option>
            <option value="qwen3.8-27b"></option>
            <option value="qwen-plus"></option>
            <option value="deepseek-chat"></option>
          </datalist>
        </label>
        <div id="targetCheckResult" class="target-check-result" hidden></div>
        <div class="target-check-actions">
          <button type="button" id="targetCheckClose" data-i18n="close">关闭</button>
          <button type="submit" id="targetCheckStart" class="primary" data-i18n="startCheck">
            开始测试
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
