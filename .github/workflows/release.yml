name: Windows EXE

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-tray:
    name: Build Windows tray exe
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tray]" pyinstaller

      - name: Build tray executable
        run: |
          python -m PyInstaller `
            --clean `
            --onefile `
            --windowed `
            --name llm-proxy-tray `
            --add-data "llm_proxy\static;llm_proxy\static" `
            --collect-submodules pystray `
            tray_launcher.py

      - name: Create checksum
        shell: powershell
        run: |
          if (!(Test-Path "dist\llm-proxy-tray.exe")) {
            throw "dist\llm-proxy-tray.exe was not created"
          }
          $hash = Get-FileHash "dist\llm-proxy-tray.exe" -Algorithm SHA256
          "$($hash.Hash)  llm-proxy-tray.exe" | Set-Content "dist\llm-proxy-tray.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-proxy-tray-windows
          path: |
            dist/llm-proxy-tray.exe
            dist/llm-proxy-tray.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows-tray
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: llm-proxy-tray-windows
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes
          fi
