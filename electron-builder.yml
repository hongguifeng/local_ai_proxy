appId: com.localai.llmproxy
productName: LLM Proxy
directories:
  output: release
files:
  - dist-node/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png
npmRebuild: true
forceCodeSigning: false
win:
  icon: resources/app-icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: LLM-Proxy-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: LLM-Proxy-${version}-${arch}-portable.${ext}
