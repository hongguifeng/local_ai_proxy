appId: com.localai.llmproxy
productName: LLM Proxy
directories:
  output: release
files:
  - dist-node/**/*
  - package.json
asar: true
npmRebuild: true
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
