[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proxy"
version = "0.1.0"
description = "Local HTTP proxy for recording OpenAI-compatible LLM traffic."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "llm_proxy maintainers" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
llm-proxy = "llm_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["llm_proxy*"]

[tool.setuptools.package-data]
llm_proxy = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
]

[tool.mypy]
python_version = "3.10"
files = ["llm_proxy"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
